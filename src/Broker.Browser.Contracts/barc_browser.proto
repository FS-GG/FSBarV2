syntax = "proto3";

package barc.browser.v1;
option csharp_namespace = "Broker.Browser.Contracts";

enum PreviewMode {
  PREVIEW_MODE_UNSPECIFIED = 0;
  PREVIEW_MODE_READ_ONLY = 1;
}

enum ValidityStatus {
  VALIDITY_STATUS_UNSPECIFIED = 0;
  VALIDITY_STATUS_CURRENT = 1;
  VALIDITY_STATUS_STALE = 2;
}

enum ObservationKind {
  OBSERVATION_KIND_UNSPECIFIED = 0;
  OBSERVATION_KIND_OWN = 1;
  OBSERVATION_KIND_VISUAL = 2;
  OBSERVATION_KIND_RADAR = 3;
}

enum IntentKind {
  INTENT_KIND_UNSPECIFIED = 0;
  INTENT_KIND_MOVE = 1;
}

enum GuestAckStatus {
  GUEST_ACK_STATUS_UNSPECIFIED = 0;
  GUEST_ACK_STATUS_CONSUMED = 1;
  GUEST_ACK_STATUS_REFUSED = 2;
}

message Limits {
  uint32 max_frame_bytes = 1;
  uint32 auth_timeout_ms = 2;
  uint32 max_entities = 3;
}

message ClientAuth {
  string game = 1;
  string protocol_version = 2;
  string profile = 3;
  string credential = 4;
  string origin = 5;
  bytes expected_session_id = 6;
}

message Bootstrap {
  string game = 1;
  string protocol_version = 2;
  string profile = 3;
  bytes session_id = 4;
  string perspective_id = 5;
  PreviewMode mode = 6;
  Validity validity = 7;
  Limits limits = 8;
}

message Validity {
  ValidityStatus status = 1;
  uint64 last_sequence = 2;
  optional uint64 received_sequence = 3;
  string detail = 4;
}

message Position3 {
  float x = 1;
  optional float elevation = 2;
  float z = 3;
}

message ObservedUnit {
  uint64 id = 1;
  uint32 definition_id = 2;
  optional int32 team_id = 3;
  ObservationKind observation = 4;
  Position3 position = 5;
  optional float health = 6;
  optional float max_health = 7;
  optional uint64 generation = 8;
}

message ObservedFeature {
  uint64 id = 1;
  uint32 definition_id = 2;
  Position3 position = 3;
}

message ResourceAmount {
  optional double current = 1;
  optional double storage = 2;
  optional double income = 3;
  optional double expenditure = 4;
}

message TeamEconomy {
  int32 team_id = 1;
  ResourceAmount metal = 2;
  ResourceAmount energy = 3;
}

message Observation {
  bytes session_id = 1;
  uint64 sequence = 2;
  int64 captured_at_unix_ms = 3;
  string perspective_id = 4;
  Validity validity = 5;
  repeated ObservedUnit units = 6;
  repeated ObservedFeature features = 7;
  optional TeamEconomy team_economy = 8;
}

message SelectInput {
  repeated uint64 unit_ids = 1;
}

message GroundTargetInput {
  Position3 position = 1;
}

message GuestRequest {
  uint64 request_id = 1;
  bytes session_id = 2;
  // The observation sequence whose state the guest must use for this input.
  // Initialization uses zero; observation input uses its own sequence.
  uint64 context_sequence = 3;
  oneof input {
    Bootstrap initialize = 10;
    Observation observation = 11;
    SelectInput select = 12;
    GroundTargetInput ground_target = 13;
  }
}

message MovePreview {
  repeated uint64 unit_ids = 1;
  Position3 ground_target = 2;
}

message GuestResponse {
  uint64 request_id = 1;
  bytes session_id = 2;
  // Every successful guest call acknowledges the exact input identity, even
  // when it proposes no preview.
  uint64 consumed_sequence = 3;
  GuestAckStatus acknowledgment = 4;
  string refusal_detail = 5;
  IntentKind kind = 6;
  oneof preview {
    MovePreview move = 10;
  }
}

message ServerEnvelope {
  oneof body {
    Bootstrap bootstrap = 1;
    Observation observation = 2;
    GuestResponse preview = 3;
  }
}

message ClientEnvelope {
  oneof body {
    ClientAuth authenticate = 1;
  }
}
