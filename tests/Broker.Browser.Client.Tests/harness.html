<!doctype html><html><head><meta charset="utf-8"><title>BARC client test</title><link rel="stylesheet" href="/client/assets/barc-preview.css"></head>
<body><main id="app"></main><script>window.__barcWorkerCompletions={process:0};window.Worker=new Proxy(window.Worker,{construct(Target,args){const worker=new Target(...args);worker.addEventListener("message",event=>{if(event.data?.state==="completed"&&event.data?.phase==="process")window.__barcWorkerCompletions.process++});return worker}});</script><script type="module">import { mount } from "/client/assets/barc-preview.js"; const profile = new URL(location.href).searchParams.get("profile") ?? undefined; window.barc = mount(document.querySelector("#app"), { assetBaseUrl: location.origin + "/", profile });</script></body></html>
